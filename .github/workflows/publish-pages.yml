name: Publish web build to Pages

on:
  workflow_run:
    workflows: ['Build client']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of a successful "Build client" run that contains the eaglercraft-web artifact'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy compiled client
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    if: >-
      (vars.PAGES_ENABLED == 'true' && github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
    steps:
      - name: Download web build from the triggering run
        uses: actions/download-artifact@v4
        with:
          name: eaglercraft-web
          path: site
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Pages content
        run: |
          set -euo pipefail
          test -s site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
