name: Build client

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      mcp918_url:
        description: 'HTTPS URL for mcp918.zip (overrides the configured variable/secret)'
        required: false
        type: string
      minecraft_jar_url:
        description: 'HTTPS URL for the Minecraft 1.8.8 client jar'
        required: false
        type: string
      assets_index_url:
        description: 'HTTPS URL for the Minecraft 1.8 assets index (1.8.json)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Compile web client
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Download license-restricted build inputs
        if: ${{ hashFiles('sources/main/java/net/minecraft/client/Minecraft.java') == '' }}
        env:
          MCP918_URL: ${{ inputs.mcp918_url || vars.MCP918_URL || secrets.MCP918_URL }}
          MINECRAFT_JAR_URL: ${{ inputs.minecraft_jar_url || vars.MINECRAFT_1_8_8_JAR_URL || secrets.MINECRAFT_1_8_8_JAR_URL }}
          ASSETS_INDEX_URL: ${{ inputs.assets_index_url || vars.ASSETS_1_8_JSON_URL || secrets.ASSETS_1_8_JSON_URL }}
          BUILD_INPUTS_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        run: scripts/download-build-inputs.sh "$RUNNER_TEMP/eagler-inputs"

      - name: Cache TeaVM jars
        id: teavm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/eagler-maven
          key: ${{ runner.os }}-teavm-${{ hashFiles('buildtools/BuildTools.jar') }}

      - name: Write headless compiler config
        env:
          TEAVM_MAVEN_URL: ${{ vars.TEAVM_MAVEN_URL || 'https://repo1.maven.org/maven2/' }}
          TEAVM_CACHE_HIT: ${{ steps.teavm-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/eagler-build" "$RUNNER_TEMP/eagler-maven" "$GITHUB_WORKSPACE/dist"

          if [ -f "$GITHUB_WORKSPACE/sources/main/java/net/minecraft/client/Minecraft.java" ]; then
            jq -n \
              --arg repo "$GITHUB_WORKSPACE" \
              --arg out "$GITHUB_WORKSPACE/dist" \
              --arg tmp "$RUNNER_TEMP/eagler-build" \
              --arg maven "$RUNNER_TEMP/eagler-maven" \
              --arg index "$GITHUB_WORKSPACE/buildtools/production-index.html" \
              --arg favicon "$GITHUB_WORKSPACE/buildtools/production-favicon.png" \
              --arg offline "$GITHUB_WORKSPACE/sources/setup/workspace_template/javascript/OfflineDownloadTemplate.txt" \
              '{
                repositoryFolder: $repo,
                outputDirectory: $out,
                temporaryDirectory: $tmp,
                mavenLocal: $maven,
                productionIndex: $index,
                productionFavicon: $favicon,
                generateOfflineDownload: true,
                offlineDownloadTemplate: $offline,
                minifying: true,
                writeSourceMap: false,
                keepTemporaryFiles: false
              }' > "$RUNNER_TEMP/eagler-build-config.json"
          else
            jq -n \
              --arg repo "$GITHUB_WORKSPACE" \
              --arg mcp "$RUNNER_TEMP/eagler-inputs/mcp918.zip" \
              --arg jar "$RUNNER_TEMP/eagler-inputs/1.8.8.jar" \
              --arg assets "$RUNNER_TEMP/eagler-inputs/1.8.json" \
              --arg out "$GITHUB_WORKSPACE/dist" \
              --arg tmp "$RUNNER_TEMP/eagler-build" \
              --arg maven "$RUNNER_TEMP/eagler-maven" \
              --arg index "$GITHUB_WORKSPACE/buildtools/production-index.html" \
              --arg favicon "$GITHUB_WORKSPACE/buildtools/production-favicon.png" \
              --arg offline "$GITHUB_WORKSPACE/sources/setup/workspace_template/javascript/OfflineDownloadTemplate.txt" \
              '{
                repositoryFolder: $repo,
                modCoderPack: $mcp,
                minecraftJar: $jar,
                assetsIndex: $assets,
                outputDirectory: $out,
                temporaryDirectory: $tmp,
                mavenLocal: $maven,
                productionIndex: $index,
                productionFavicon: $favicon,
                generateOfflineDownload: true,
                offlineDownloadTemplate: $offline,
                minifying: true,
                writeSourceMap: false,
                keepTemporaryFiles: false
              }' > "$RUNNER_TEMP/eagler-build-config.json"
          fi

          if [ "$TEAVM_CACHE_HIT" != "true" ]; then
            jq --arg url "$TEAVM_MAVEN_URL" '.mavenURL = $url' \
              "$RUNNER_TEMP/eagler-build-config.json" > "$RUNNER_TEMP/eagler-build-config.tmp.json"
            mv "$RUNNER_TEMP/eagler-build-config.tmp.json" "$RUNNER_TEMP/eagler-build-config.json"
          fi

      - name: Compile buildtools
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/buildtools/src/main/java" ]; then
            mkdir -p "$RUNNER_TEMP/buildtools-classes"
            find "$GITHUB_WORKSPACE/buildtools/src/main/java" -name "*.java" > "$RUNNER_TEMP/buildtools-sources.txt"
            javac -version
            javac -source 1.8 -target 1.8 -encoding UTF-8 \
              -cp "$GITHUB_WORKSPACE/buildtools/deps/*" \
              -d "$RUNNER_TEMP/buildtools-classes" \
              @"$RUNNER_TEMP/buildtools-sources.txt"
            jar cf "$RUNNER_TEMP/BuildTools.jar" -C "$RUNNER_TEMP/buildtools-classes" .
            cp "$RUNNER_TEMP/BuildTools.jar" "$GITHUB_WORKSPACE/buildtools/BuildTools.jar"
          fi

      - name: Compile client
        run: |
          set -euo pipefail
          java -Deaglercraft.TeaVMBridge="$GITHUB_WORKSPACE/buildtools/TeaVMBridge.jar" \
            -cp "$GITHUB_WORKSPACE/buildtools/BuildTools.jar:$GITHUB_WORKSPACE/buildtools/deps/*" \
            net.lax1dude.eaglercraft.v1_8.buildtools.gui.headless.CompileLatestClientHeadless \
            -y "$RUNNER_TEMP/eagler-build-config.json"

      - name: Verify build output
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/classes.js
          test -s dist/assets.epk
          test -d dist/lang
          echo "Generated HTML files:"
          find dist -maxdepth 1 -type f -name '*.html' -printf '%f (%s bytes)\n' | sort

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-html
          path: dist/*.html
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish HTML files to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download HTML artifacts
        uses: actions/download-artifact@v4
        with:
          name: eaglercraft-html
          path: html

      - name: Attach standalone HTML clients to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find html -maxdepth 1 -type f -name '*.html' ! -name 'index.html' | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No standalone HTML client was generated"
            exit 1
          fi
          printf 'Publishing: %s\n' "${assets[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes
          fi
