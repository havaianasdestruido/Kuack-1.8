name: Sync with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and open PR if behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://git.eaglercraft.rip/eaglercraft/eaglercraft-1.8.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          SYNC_BRANCH="chore/sync-upstream"
          git checkout -B "$SYNC_BRANCH"
          if ! git merge --no-commit --no-ff upstream/main --allow-unrelated-histories; then
            echo "Merge conflicts detected; aborting automatic sync." >&2
            git merge --abort || true
            exit 1
          fi

          # Preserve fork workflows
          git checkout HEAD -- .github/workflows/ || true
          git commit -m "chore: sync with upstream/main"
          git push --force-with-lease origin "$SYNC_BRANCH"

          if ! gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync with upstream/main" \
              --body "Automated upstream sync from \`upstream/main\`. Please review before merging."
          fi
